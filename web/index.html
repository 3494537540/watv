<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="哇TV">
  <!-- 固定视口，减轻移动端模拟 / 软键盘导致 physicalSize、viewInsets 算成负数后白屏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="哇TV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>哇TV</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #FAFAFA;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }
  </style>
  <script>
    // 视口抖动时把 scroll 钉回 0，避免 Flutter Web 算出负 viewInsets 直接 assert 崩白屏
    (function () {
      function pin() {
        try {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        } catch (_) {}
      }
      window.addEventListener('resize', pin, { passive: true });
      window.addEventListener('orientationchange', pin, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', pin, { passive: true });
        window.visualViewport.addEventListener('scroll', pin, { passive: true });
      }
      pin();
    })();
  </script>
</head>
<body>
  <!--
    国内环境：禁用 CDN，使用构建产物内的本地 CanvasKit，
    避免 Failed to fetch / 白屏（fonts.gstatic / gstatic canvaskit）。
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "canvaskit/"
      }
    });
  </script>
</body>
</html>
