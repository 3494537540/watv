# 灰火 H5 / 跨域：挂到站点 nginx server{} 内（或对应 location）
# 让 localhost 调试的 Flutter Web 能直连 https://154.12.29.28
#
# 用法：include 进站点 conf 后 nginx -t && nginx -s reload

# 预检
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Cookie" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}

add_header Access-Control-Allow-Origin * always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Cookie" always;
