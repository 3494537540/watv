<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="哇TV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3AD7DF"/>
      <stop offset="100%" stop-color="#1ECAD3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0A8A92" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 圆角方底，适合 App / QQ 互联图标 -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- 卡通「哇」：矢量字，居中加粗圆润 -->
  <text
    x="50"
    y="58"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif"
    font-size="58"
    font-weight="800"
    fill="#FFFFFF"
    filter="url(#soft)"
  >哇</text>
</svg>
